services:
  - type: web
    name: clinicdesk-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '3001'
      - key: MOCK_LLM
        value: 'false'
      - key: DEMO_MODE
        value: 'false'
      - key: TRUST_PROXY_HOPS
        value: '1'
      - key: CHAT_RATE_LIMIT
        value: '20'
      - key: WEB_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CRON_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: OPENAI_INPUT_COST_PER_MILLION
        value: '0.15'
      - key: OPENAI_OUTPUT_COST_PER_MILLION
        value: '0.60'
      - key: OPENAI_EMBEDDING_COST_PER_MILLION
        value: '0.02'
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: web
    name: clinicdesk-web
    runtime: static
    buildCommand: npm ci && npm run build -w web
    staticPublishPath: ./web/dist
    envVars:
      - key: NODE_VERSION
        value: '20.20.2'
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLINIC_ID
        value: 11111111-1111-4111-8111-111111111111
      - key: VITE_DEMO_MODE
        value: 'false'
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
