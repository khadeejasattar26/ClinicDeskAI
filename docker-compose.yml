services:
  server:
    build: .
    ports: ["3001:3001"]
    env_file: .env
    environment:
      NODE_ENV: development
  web:
    image: node:20-bookworm-slim
    working_dir: /app
    volumes: [".:/app", "web_modules:/app/node_modules"]
    ports: ["5173:5173"]
    command: sh -c "npm ci && npm run dev -w web -- --host 0.0.0.0"
    environment:
      VITE_PROXY_TARGET: http://server:3001
volumes:
  web_modules:
